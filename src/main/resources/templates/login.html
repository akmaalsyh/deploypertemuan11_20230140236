<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .login-container {
            max-width: 400px;
            margin-top: 100px;
        }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center">
    <div class="card shadow login-container p-4 w-100 bg-white rounded-3">
        <h3 class="text-center mb-4 fw-bold text-primary">Selamat Datang</h3>
        <p class="text-muted text-center small mb-4">Silakan masuk menggunakan akun Anda</p>

        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show small py-2" role="alert">
            <span th:text="${errorMessage}">Pesan Error</span>
            <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label font-monospace small">Username</label>
                <input type="text" class="form-control text-muted" id="username" name="username" placeholder="Masukkan username" required>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label font-monospace small">Password</label>
                <input type="password" class="form-control text-muted" id="password" name="password" placeholder="Masukkan password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">Login</button>
        </form>

        <hr class="text-muted my-4">

        <div class="text-center">
            <p class="mb-1 text-secondary small">Belum punya akun?</p>
            <a th:href="@{/register}" class="text-decoration-none small fw-semibold">Daftar/Register disini</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
