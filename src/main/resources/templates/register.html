<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .register-container {
            max-width: 480px;
            margin-top: 60px;
            margin-bottom: 60px;
        }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center">
    <div class="card shadow register-container p-4 w-100 bg-white rounded-3">
        <h3 class="text-center mb-2 fw-bold text-success">Buat Akun</h3>
        <p class="text-muted text-center small mb-4">Lengkapi form di bawah untuk mendaftar</p>

        <form th:action="@{/register}" th:object="${request}" method="post">
            <div class="mb-3">
                <label class="form-label small font-monospace">Username</label>
                <input type="text" class="form-control" th:field="*{username}" placeholder="Buat username unik" required>
            </div>

            <div class="mb-3">
                <label class="form-label small font-monospace">Password</label>
                <input type="password" class="form-control" th:field="*{password}" placeholder="Buat password aman" required>
            </div>

            <div class="mb-3">
                <label class="form-label small font-monospace">Nama Lengkap</label>
                <input type="text" class="form-control" th:field="*{nama}" placeholder="Masukkan nama lengkap Anda" required>
            </div>

            <div class="mb-4">
                <label class="form-label small font-monospace">Alamat</label>
                <input type="text" class="form-control" th:field="*{alamat}" placeholder="Masukkan alamat tempat tinggal" required>
            </div>

            <button type="submit" class="btn btn-success w-100 py-2 fw-semibold shadow-sm">Daftar Sekarang</button>
        </form>

        <hr class="text-muted my-4">

        <div class="text-center">
            <p class="mb-1 text-secondary small">Sudah punya akun resmi?</p>
            <a th:href="@{/login}" class="text-decoration-none small fw-semibold text-success">Login disini</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
