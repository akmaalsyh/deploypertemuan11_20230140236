<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">Aplikasi Portal</a>
        <div class="ms-auto">
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-sm btn-danger px-3">Keluar (Logout)</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card border-0 shadow rounded-3 bg-white p-4">
                <div class="d-flex align-items-center mb-4">
                    <div class="bg-primary text-white p-3 rounded-circle me-3 fw-bold fs-4 d-flex align-items-center justify-content-center" style="width: 60px; height: 60px;">
                        <span th:text="${#strings.substring(user.username, 0, 1).toUpperCase()}">U</span>
                    </div>
                    <div>
                        <h2 class="mb-0 fw-bold">Halo, <span th:text="${profile.nama}">Nama User</span>!</h2>
                        <p class="text-muted mb-0">Selamat datang kembali di dashboard utama sistem.</p>
                    </div>
                </div>

                <h5 class="fw-bold mb-3 border-bottom pb-2 text-secondary">Informasi Detail Akun</h5>

                <div class="table-responsive">
                    <table class="table table-striped table-bordered align-middle">
                        <tbody>
                        <tr>
                            <th scope="row" class="w-25 font-monospace small bg-light">User ID</th>
                            <td class="text-muted" th:text="${user.id}">-</td>
                        </tr>
                        <tr>
                            <th scope="row" class="font-monospace small bg-light">Username</th>
                            <td class="fw-semibold text-primary" th:text="${user.username}">-</td>
                        </tr>
                        <tr>
                            <th scope="row" class="font-monospace small bg-light">Nama Lengkap</th>
                            <td th:text="${profile.nama}">-</td>
                        </tr>
                        <tr>
                            <th scope="row" class="font-monospace small bg-light">Alamat</th>
                            <td th:text="${profile.alamat}">-</td>
                        </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
